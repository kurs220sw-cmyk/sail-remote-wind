# Kostenlos: stündlich Wind-Grid bauen und auf GitHub Pages legen
name: Update Wind Grid

on:
  schedule:
    # jede Stunde
    - cron: '15 * * * *'
  workflow_dispatch: # manuell auslösbar

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch wind grid
        run: node update-wind-grid.mjs

      - name: Commit world.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/world.json
          git diff --staged --quiet || git commit -m "chore: update wind grid $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
