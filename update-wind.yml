# Stündlich Wind- + Wellen-Grid (Open-Meteo) → GitHub Pages
name: Update Wind Grid

on:
  schedule:
    - cron: '15 * * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch wind grid
        run: node update-wind-grid.mjs

      - name: Fetch waves grid
        run: node update-waves-grid.mjs

      - name: Commit grids
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/world.json public/waves.json
          git diff --staged --quiet || git commit -m "chore: update wind+waves grid $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
